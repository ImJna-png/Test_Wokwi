[platformio]
default_envs = station_meteo

[env:station_meteo]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -Wl,-u,_printf_float
    -DGROVE_GPS_SWAP=1
    -DBOARD_RED_BUTTON_INDEX=1
build_src_filter =
    -<*>
    +<main.c>
    +<setup.c>
    +<bme280.c>
    +<grove_rtc_ds1307.c>
    +<grove_light.c>
    +<grove_gps_air530z.c>
    +<board.c>
    +<grove_button.c>
    +<grove_rgb.c>
    +<sd_logger.c>
    +<sd_diskio.c>